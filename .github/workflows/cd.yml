# CD: after CI passes on main -> migrate Neon -> deploy that exact image -> smoke test.
# Rollback: Actions -> CD -> Run workflow -> paste an older commit SHA.

name: CD

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (rollback). Migrations are skipped."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.LIVE_URL }}

    env:
      SHA: ${{ github.event.inputs.sha || github.event.workflow_run.head_sha }}

    steps:
    - name: Checkout deployment code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.11.32"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Run migrations on Neon
      if: github.event_name == 'workflow_run'
      env:
        APP_ENV: production
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: uv run alembic upgrade head

    - name: Deploy exact image to Render
      env:
        HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${SHA}"
        ENCODED=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE")
        echo "Deploying $IMAGE"
        curl --fail --silent --show-error -X POST "${HOOK}&imgURL=${ENCODED}"

    - name: Smoke test live application
      run: |
        for attempt in {1..90}; do
          echo "Smoke test attempt $attempt of 90"

          if uv run python scripts/smoke.py "${{ vars.LIVE_URL }}" --expect-version "${SHA}"; then
            echo "Smoke tests passed!"
            exit 0
          fi

          if [ "$attempt" -lt 90 ]; then
            echo "Application not ready yet. Waiting 10 seconds..."
            sleep 10
          fi
        done

        echo "Smoke tests failed after 90 attempts."
        exit 1
