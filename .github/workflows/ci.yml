name: CI

on:
  pull_request:
  push:
    branches:
    - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # pragma: allowlist secret
          POSTGRES_DB: app
        ports:
        - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://app:app@localhost:5433/app # pragma: allowlist secret

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.11.32"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked

    - name: Run lint
      run: uv run poe lint

    - name: Run pre-commit (stretch task)
      run: uv run pre-commit run --all-files

    - name: Run tests and coverage
      run: uv run poe cov

  image:
    name: build image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set image name
      run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      if: github.event_name == 'push'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and publish image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        build-args: |
          GIT_SHA=${{ github.sha }}
        tags: |
          ${{ env.IMAGE }}:${{ github.sha }}
          ${{ env.IMAGE }}:main
        cache-from: type=gha
        cache-to: type=gha,mode=max
